<!DOCTYPE html>
<html lang="az" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}MissCaddy{% endblock %} — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full text-gray-100 antialiased">

{% block full_page %}
<div class="flex h-full min-h-screen">

  <!-- Sidebar -->
  <aside class="w-56 bg-gray-900 border-r border-gray-800 flex flex-col fixed inset-y-0">
    <div class="px-5 py-5 border-b border-gray-800">
      <span class="text-xl font-bold text-brand-500">MissCaddy</span>
      <p class="text-xs text-gray-500 mt-0.5">Bot Dashboard</p>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1">
      <a href="/"
         class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium
                {% if request.url.path == '/' %}bg-brand-600 text-white{% else %}text-gray-400 hover:bg-gray-800 hover:text-white{% endif %}
                transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0"/>
        </svg>
        Qruplar
      </a>
    </nav>
    <div class="px-3 py-4 border-t border-gray-800">
      <a href="/logout"
         class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400 hover:bg-gray-800 hover:text-white transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        Çıxış
      </a>
    </div>
  </aside>

  <!-- Main content -->
  <main class="ml-56 flex-1 p-8">
    {% block content %}{% endblock %}
  </main>
</div>
{% endblock %}

</body>
</html>
