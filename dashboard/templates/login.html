<!DOCTYPE html>
<html lang="az" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş — MissCaddy</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center text-gray-100">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-indigo-400">MissCaddy</h1>
      <p class="text-gray-500 text-sm mt-1">Bot idarəetmə paneli</p>
    </div>

    <div class="bg-gray-900 rounded-2xl border border-gray-800 p-8 shadow-2xl">
      {% if error %}
      <div class="mb-4 px-4 py-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 text-sm">
        İstifadəçi adı və ya parol səhvdir.
      </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-5">
        <div>
          <label class="block text-sm text-gray-400 mb-1.5">İstifadəçi adı</label>
          <input name="username" type="text" autocomplete="username"
                 class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm
                        focus:outline-none focus:border-indigo-500 transition placeholder-gray-600"
                 placeholder="admin" />
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1.5">Parol</label>
          <input name="password" type="password" autocomplete="current-password"
                 class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm
                        focus:outline-none focus:border-indigo-500 transition placeholder-gray-600"
                 placeholder="••••••••" />
        </div>
        <button type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium
                       rounded-lg py-2.5 text-sm transition">
          Daxil ol
        </button>
      </form>
    </div>
  </div>
</body>
</html>
